name: Kaggle GPU 模型测试

on:
  # 手动触发：可指定要测试的 HF 模型和输入文本
  workflow_dispatch:
    inputs:
      model_id:
        description: 'Hugging Face 模型 ID'
        required: true
        default: 'distilbert-base-uncased-finetuned-sst-2-english'
      prompt_text:
        description: '测试输入文本'
        required: true
        default: 'I love this movie, it is fantastic!'
  # push 不再自动跑：避免与手动 dispatch 竞争 Kaggle GPU 会话名额（同时最多 2 个）
  # push:
  #   branches: [main]

jobs:
  run-on-kaggle-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: 在 Kaggle GPU 上运行 HF 模型测试
        # 使用自己的 fork：增加了 accelerator（可选 T4）与 max_poll_minutes（轮询上限）参数
        uses: shejitu/kaggle-script-action@main
        with:
          username: ${{ secrets.KAGGLE_USERNAME }}
          key: ${{ secrets.KAGGLE_KEY }}
          title: "HF Model GPU Test"
          # 注意：custom_script 会被拼进 ipynb JSON，内部只能用单引号，不能用双引号
          custom_script: |
            python hf_model_test.py --model '${{ github.event.inputs.model_id || 'distilbert-base-uncased-finetuned-sst-2-english' }}' --text '${{ github.event.inputs.prompt_text || 'I love this movie, it is fantastic!' }}'
          enable_internet: true
          enable_gpu: true
          enable_tpu: false
          # 指定 T4：Kaggle 预装的新版 PyTorch 不含 P100(sm_60) 的 CUDA 内核，会报
          # "CUDA error: no kernel image is available"，T4(sm_75) 正常支持
          accelerator: nvidiaTeslaT4
          sleep_time: 30
          # 轮询上限：超时后自动拉 kernel 日志判断真实执行状态，避免空转 6 小时
          max_poll_minutes: 20
